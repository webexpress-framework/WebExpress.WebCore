name: UnitTest-Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore ./WebExpress.WebCore.slnx

      - name: Build project
        run: dotnet build ./WebExpress.WebCore.slnx --no-restore --configuration Release

      - name: Run xUnit tests
        id: tests
        continue-on-error: true
        run: dotnet test --project ./WebExpress.WebCore.Test/WebExpress.WebCore.Test.csproj --no-build --configuration Release --report-trx --results-directory ./TestResults

      - name: Print failing tests on failure
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          files = sorted(glob.glob('./TestResults/**/*.trx', recursive=True))
          if not files:
              print('No TRX report produced - cannot extract failure details.')
              sys.exit(0)

          total_failed = 0
          for path in files:
              print(f'::group::Report {path}')
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  print(f'Failed to parse {path}: {exc}')
                  print('::endgroup::')
                  continue

              report_failed = 0
              for result in root.iter(f'{ns}UnitTestResult'):
                  if result.get('outcome') != 'Failed':
                      continue
                  report_failed += 1
                  total_failed += 1
                  print(f'\n--- FAILED: {result.get("testName")} ---')

                  err = result.find(f'.//{ns}ErrorInfo')
                  if err is not None:
                      message = err.find(f'{ns}Message')
                      stack = err.find(f'{ns}StackTrace')
                      if message is not None and message.text:
                          print('Message:')
                          print(message.text.rstrip())
                      if stack is not None and stack.text:
                          print('StackTrace:')
                          print(stack.text.rstrip())

                  stdout = result.find(f'.//{ns}Output/{ns}StdOut')
                  if stdout is not None and stdout.text:
                      print('StdOut:')
                      print(stdout.text.rstrip())

              if report_failed == 0:
                  print('(no failed tests in this report)')
              print('::endgroup::')

          print(f'\nTotal failed tests: {total_failed}')
          PY

      - name: Upload TRX report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-results
          path: src/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Fail workflow when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
